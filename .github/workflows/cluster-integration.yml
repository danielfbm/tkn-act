name: cluster-integration

# Runs the k3d cluster-backend end-to-end suite (build tag: cluster). Boots
# an ephemeral k3d cluster, installs Tekton via the project's installer, and
# runs the cluster-e2e tests against it.
#
# Gated by paths on PRs (cluster code paths only) to avoid the 5-10 minute
# cluster bring-up cost on unrelated PRs. Unconditional on main / release/*.

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    paths:
      # Cluster-specific code.
      - 'cmd/tkn-act/cluster*.go'
      - 'cmd/tkn-act/doctor*.go'
      - 'internal/backend/backend.go'
      - 'internal/backend/cluster/**'
      - 'internal/cluster/**'
      - 'internal/clustere2e/**'
      - 'internal/cmdrunner/**'
      # Engine + types may change pipeline-run semantics that the cluster
      # path delegates to the real Tekton controller.
      - 'internal/engine/**'
      - 'internal/loader/**'
      - 'internal/tektontypes/**'
      - 'internal/validator/**'
      - 'testdata/e2e/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/cluster-integration.yml'

permissions:
  contents: read

jobs:
  e2e:
    name: k3d e2e (-tags cluster) — Tekton ${{ matrix.tekton-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest still-supported LTS + newest declared LTS, each at its
        # latest patch (Tekton's support window is 12 months from
        # release; v1.9 EOL 2027-01-30, v1.15 EOL 2027-07-31). Keep this
        # list aligned with
        # https://github.com/tektoncd/pipeline/blob/main/releases.md and
        # bump per the policy in
        # docs/superpowers/specs/2026-11-03-audit-and-tekton-v1.15-design.md
        # (on each new declared LTS: default -> its latest patch, matrix
        # -> {oldest supported LTS, newest LTS}). The newest entry must
        # equal tekton.DefaultTektonVersion.
        tekton-version:
          - v1.9.9
          - v1.15.5
    env:
      # Bump together with the Makefile pins. KUBECTL_VERSION tracks the
      # minor of the k3s node image pinned in internal/cluster/k3d
      # (DefaultK3sImage).
      K3D_VERSION: v5.9.0
      KUBECTL_VERSION: v1.34.12
      TKN_ACT_TEKTON_VERSION: ${{ matrix.tekton-version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: install kubectl ${{ env.KUBECTL_VERSION }}
        run: |
          curl -fsSL -o kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum -c -
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: install k3d ${{ env.K3D_VERSION }}
        # Tagged release binary, checksum-verified against the release's
        # own checksums.txt — not the unpinned main-branch install.sh.
        run: |
          base="https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}"
          curl -fsSL -o k3d "${base}/k3d-linux-amd64"
          want=$(curl -fsSL "${base}/checksums.txt" | awk '$2 ~ /(^|\/)k3d-linux-amd64$/ {print $1}')
          test -n "$want"
          echo "${want}  k3d" | sha256sum -c -
          chmod +x k3d
          sudo mv k3d /usr/local/bin/k3d
          k3d version

      - name: doctor (sanity)
        run: |
          go build -o tkn-act ./cmd/tkn-act
          ./tkn-act doctor -o json

      - name: go test -tags cluster ./internal/clustere2e/...
        # -v surfaces per-test harness/controller logs in the CI console for
        # easier debugging (complements the failure dump below; the step is
        # already collapsible in the UI). -coverpkg=./... instruments every
        # package so the cluster backend path is attributed; the profile feeds
        # the per-version coverage summary below (report-only).
        run: |
          go test -v -tags cluster -count=1 -timeout 25m \
            -coverpkg=./... -coverprofile=coverage-cluster.txt \
            ./internal/clustere2e/...

      - name: cluster coverage summary
        if: always()
        # Report-only: cluster coverage is published per Tekton version to the
        # job summary, NOT merged into the unit+integration total (that runs on
        # a separate single-runner workflow). No file ⇒ tests never produced a
        # profile (early failure); skip quietly.
        run: |
          f=coverage-cluster.txt
          if [ ! -s "$f" ]; then
            echo "cluster coverage: no profile produced (tests failed early?)" >&2
            exit 0
          fi
          total=$(go tool cover -func="$f" 2>/dev/null | awk '/^total:/{print $NF}')
          {
            echo "## Cluster coverage — Tekton ${{ matrix.tekton-version }}"
            echo
            echo "**Total: \`${total:-n/a}\`** (statements, \`-tags cluster\`, coverpkg=./...)"
            echo
            echo "_Reported separately; not folded into the unit+integration total._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "cluster coverage total (Tekton ${{ matrix.tekton-version }}) = ${total:-n/a}"

      - name: dump cluster state on failure
        if: failure()
        run: |
          set +e
          # The cluster-e2e harness names the k3d cluster `tkn-act-e2e`;
          # k3d derives kube context as `k3d-<cluster>`. (Earlier this
          # step used `k3d-tkn-act` and silently emitted "context was not
          # found" — debug output was empty for every prior cluster-CI
          # failure.)
          CTX=k3d-tkn-act-e2e
          k3d cluster list || true
          kubectl --context "$CTX" get nodes -o wide || true
          kubectl --context "$CTX" get ns || true
          kubectl --context "$CTX" get pods --all-namespaces -o wide || true
          kubectl --context "$CTX" describe pods --all-namespaces || true
          # `kubectl logs` doesn't accept --all-namespaces; iterate the
          # tekton-pipelines namespace explicitly.
          kubectl --context "$CTX" -n tekton-pipelines logs -l app.kubernetes.io/name=controller --tail=400 --all-containers || true
          # Dump every PipelineRun/TaskRun the harness left behind so a
          # classification mismatch (status = X, want Y) can be attributed
          # to a specific Tekton condition reason.
          for ns in $(kubectl --context "$CTX" get ns -o jsonpath='{.items[?(@.metadata.name)].metadata.name}' 2>/dev/null); do
            case "$ns" in
              tkn-act-*)
                echo "===== $ns ====="
                kubectl --context "$CTX" -n "$ns" get pipelinerun,taskrun -o wide || true
                kubectl --context "$CTX" -n "$ns" get pipelinerun -o yaml || true
                kubectl --context "$CTX" -n "$ns" get taskrun -o yaml || true
                ;;
            esac
          done

      - name: upload cluster coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cluster-${{ matrix.tekton-version }}
          path: coverage-cluster.txt
          if-no-files-found: ignore

      - name: tear down cluster
        if: always()
        run: ./tkn-act cluster down -y || true
