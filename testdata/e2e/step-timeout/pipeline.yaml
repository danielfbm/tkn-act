# Step.timeout: the first step sleeps past its 2s budget and is
# stopped; the Task (and so the PipelineRun) fails on both backends.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: slow-step
spec:
  steps:
    - name: sleep
      image: alpine:3
      timeout: 2s
      script: |
        echo "sleeping past the step timeout"
        sleep 30
        echo "should not reach here"
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: step-timeout
spec:
  tasks:
    - name: slow
      taskRef: { name: slow-step }
